<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#7ec8f2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Owen &amp; Alice's Adventure</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #7ec8f2;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
      }
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #7ec8f2;
        color: #23405c;
        text-align: center;
        padding: 24px;
        z-index: 10;
      }
      #rotate .phone {
        width: 54px;
        height: 96px;
        border: 6px solid #23405c;
        border-radius: 12px;
        animation: turn 2.2s ease-in-out infinite;
      }
      #rotate h1 {
        font-size: 28px;
        margin: 0;
      }
      #rotate p {
        font-size: 18px;
        margin: 0;
      }
      @keyframes turn {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      body.portrait #rotate {
        display: flex;
      }
      body.portrait #game {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite">
      <div class="phone"></div>
      <h1>Turn your device sideways</h1>
      <p>Owen and Alice like to run in landscape.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
